name: Bootstrap full project

on:
  push:
    branches:
      - agent/full-enterprise-impact-navigator
    paths:
      - ".github/workflows/bootstrap-project.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/full-enterprise-impact-navigator
          fetch-depth: 0

      - name: Reconstruct and verify project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          allowed = set(b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          payload = b"".join(
              bytes(value for value in path.read_bytes() if value in allowed)
              for path in sorted(Path(".bootstrap").glob("part-*"))
          )

          duplicated_offset = 76
          if payload[duplicated_offset:duplicated_offset + 1] != b"d":
              raise RuntimeError(
                  f"Unexpected staged payload at repair offset {duplicated_offset}: "
                  f"{payload[duplicated_offset:duplicated_offset + 1]!r}"
              )

          payload = payload[:duplicated_offset] + payload[duplicated_offset + 1:]
          archive = base64.b64decode(payload, validate=True)
          actual_hash = hashlib.sha256(archive).hexdigest()
          expected_hash = "be91f10f618923fa57820491d0ed9a442ec2115d175156991d4fd42107edce55"
          if actual_hash != expected_hash:
              raise RuntimeError(
                  f"Archive integrity mismatch: expected {expected_hash}, got {actual_hash}"
              )

          Path("/tmp/project.tar.gz").write_bytes(archive)
          print(f"Verified archive {actual_hash} ({len(archive)} bytes)")
          PY
          tar -xzf /tmp/project.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml

      - name: Validate reconstructed project
        shell: bash
        run: |
          set -euo pipefail
          npm run validate

      - name: Commit full application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build full Enterprise Impact Navigator"
          git push origin HEAD:agent/full-enterprise-impact-navigator
