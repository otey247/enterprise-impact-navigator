name: Finalize source

on:
  push:
    branches:
      - agent/full-enterprise-impact-navigator
    paths:
      - ".github/workflows/finalize-source.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/full-enterprise-impact-navigator
          fetch-depth: 0

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .publish-src ]; then
            echo "Source was already finalized."
            exit 0
          fi

          mkdir -p public/js public server
          cat .publish-src/public__js__views.js.part-* > public/js/views.js
          cat .publish-src/public__styles.css.part-* > public/styles.css
          cat .publish-src/server__impact-engine.mjs.part-* > server/impact-engine.mjs

          echo "e22f4776625fd1d624afc127354d2716000a4c544f8432ec8806e22dbdf012a5  public/js/views.js" | sha256sum --check -
          echo "672857569154c178166b9ec3cbd559af4c59e39d45535f180f8ceb850b4cd42e  public/styles.css" | sha256sum --check -
          echo "1306bdd36527fd0ab52df82d2e4f35aa3ece823a4349cb2fd41a4a08f0deceb6  server/impact-engine.mjs" | sha256sum --check -

          rm -rf .publish-src .publish .bootstrap
          rm -f .github/workflows/bootstrap-project.yml
          rm -f .github/workflows/finalize-source.yml

      - name: Validate full application
        shell: bash
        run: |
          set -euo pipefail
          npm run validate

      - name: Commit finalized application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes remain to commit."
            exit 0
          fi
          git commit -m "Build full Enterprise Impact Navigator"
          git push origin HEAD:agent/full-enterprise-impact-navigator
